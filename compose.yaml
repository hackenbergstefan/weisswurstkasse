services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - breakfast-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    build: .
    command: ["worker"]
    env_file: .env
    volumes:
      - breakfast-data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  breakfast-data:
