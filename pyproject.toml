[project]
name = "weisswurstrunde"
version = "0.1.0"
description = "Self-hosted weekly breakfast orders and auditable group accounting"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "dj-database-url>=2.3,<4",
    "gunicorn>=23,<26",
    "httpx>=0.28,<0.29",
    "whitenoise>=6.9,<7",
    "qrcode>=8.2,<9",
]

[dependency-groups]
dev = ["ruff>=0.11", "coverage>=7.8"]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
