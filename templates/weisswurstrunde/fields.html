{{ form.non_field_errors }}
{% for field in form %}
  {% if field.is_hidden %}{{ field }}{% else %}
  <div class="field {% if field.errors %}field-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %}<span class="optional">optional</span>{% endif %}</label>
    {{ field }}
    {{ field.errors }}
  </div>
  {% endif %}
{% endfor %}
